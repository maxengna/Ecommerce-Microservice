# -----------------------------
# CONNECTIONS & NETWORKING
# -----------------------------
listen_addresses = '*'          # รับ connection จาก network
port = 5432
max_connections = 100

# -----------------------------
# MEMORY (ต้องปรับตาม RAM)
# -----------------------------
shared_buffers = 512MB          # ~25% ของ RAM (แนะนำ)
work_mem = 4MB                  # ต่อ query
maintenance_work_mem = 64MB

# -----------------------------
# WRITE AHEAD LOG (WAL)
# -----------------------------
wal_level = replica
synchronous_commit = on
max_wal_size = 1GB
min_wal_size = 80MB

# -----------------------------
# QUERY PLANNER
# -----------------------------
effective_cache_size = 768MB    # ~75% ของ RAM

# -----------------------------
# LOGGING
# -----------------------------
logging_collector = on
log_destination = 'stderr'
log_directory = 'log'
log_filename = 'postgresql.log'

log_min_duration_statement = 200    # log query > 2000ms
log_connections = on
log_disconnections = on
log_line_prefix = '%m [%p] %u@%d '

# -----------------------------
# AUTOVACUUM
# -----------------------------
autovacuum = on
autovacuum_max_workers = 3

# -----------------------------
# LOCALE / TIMEZONE
# -----------------------------
timezone = 'UTC'
datestyle = 'iso, mdy'

# -----------------------------
# SECURITY
# -----------------------------
password_encryption = scram-sha-256

# -----------------------------
# PERFORMANCE (optional tuning)
# -----------------------------
random_page_cost = 1.1
effective_io_concurrency = 200